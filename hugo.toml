baseURL = '/'
locale = 'en-us'
title = 'Blog Title'

[module]
  [[module.imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[params]
mainSections = ['post']

  [params.sidebar]
    emoji    = '✏️'
    subtitle = 'Blog subtitle'
    # avatar = 'img/avatar.png'      # 有头像再取消注释，文件放 static/img/avatar.png

  [params.widgets]
  homepage = [
    { type = 'search' },
    { type = 'archives',  params = { limit = 5 } },
    { type = 'categories', params = { limit = 10 } },
    { type = 'tag-cloud',  params = { limit = 10 } },
  ]
  page = [{ type = 'toc' }]

[pagination]
pagerSize = 10

[permalinks]
post = '/p/:slug/'
page = '/:slug/'

